<!doctype html>
  <html lang="zh-CN">
  <head>
    <meta charset="utf-8"/>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕸️</text></svg>"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>P26 协同水军雷达</title>
    <link rel="stylesheet" href="../shared/design-tokens.css"/>
    <link rel="stylesheet" href="./styles.css"/>
    <meta name="description" content="可视化识别协同水军：力导向图拓扑模拟、时间阈值过滤、账号评分与CSV导出。"/>
    <link rel="manifest" href="./manifest.json"/>
  </head>
  <body>
    <main aria-label="主内容区域" class="app">
      <header class="hero">
        <h1>协同水军雷达</h1>
        <p>模拟并可视化社交网络中协同水军的拓扑结构，通过时间阈值与度中心性过滤可疑账号。</p>
      </header>

      <section class="card">
        <details class="teach-card" open>
          <summary>🎓 什么是协同水军？如何识别？</summary>
          <p>协同水军（Coordinated Inauthentic Behavior）指由真实人类或机器账号组成、受统一指挥的信息操控网络。识别信号：①账号注册时间集中；②发帖内容高度一致；③互动时间间隔极短；④账号互粉比例异常高。本工具通过力导向图可视化账号间的协同模式。</p>
        </details>
      </section>

      <div class="main-grid">
        <section class="card controls-panel">
          <h2 style="margin:0 0 12px;font-size:1rem">模拟参数</h2>
          <label>账号数量：<span id="valNodes">60</span></label>
          <input type="range" id="valNodes" min="20" max="120" value="60"/>
          <label style="margin-top:10px">边数密度（×节点数）：<span id="valEdges">-</span></label>
          <div class="btn-row" style="margin-top:12px">
            <button type="button" id="btnGenerate">🔄 生成网络</button>
            <button type="button" id="btnExport" class="export-btn">导出 CSV</button>
          </div>
          <hr style="margin:14px 0;border:0;border-top:1px solid #eee"/>
          <h2 style="margin:0 0 12px;font-size:1rem">水军过滤阈值</h2>
          <label>时间间隔阈值：<span id="valTimeThresh">60s</span></label>
          <input type="range" id="paramTime" min="10" max="300" value="60" step="10"/>
          <label style="margin-top:10px">最小度数阈值：<span id="valDegreeThresh">3</span></label>
          <input type="range" id="paramDegree" min="1" max="10" value="3"/>
          <button type="button" id="btnRunFilter" style="margin-top:12px">🔍 应用过滤</button>

          <div id="detailPanel" style="display:none;margin-top:14px;padding:12px;border-radius:10px;background:#fef2f2;border:1px solid #fecaca">
            <!-- 账号详情由 JS 填写 -->
          </div>
          <p id="status" role="status" aria-live="polite" style="margin-top:10px;font-size:.85rem">状态: 正在加载…</p>
        </section>

        <section class="card chart-panel">
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:.8rem">
            <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:50%;background:#3b82f6;display:inline-block"></span>正常账号</span>
            <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:50%;background:#f97316;display:inline-block"></span>模拟水军</span>
            <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:50%;background:#ef4444;display:inline-block"></span>过滤命中</span>
          </div>
          <div id="chartContainer" style="width:100%;height:480px;border-radius:12px;background:#f8f9fb;border:1px solid #eee"></div>
          <p style="margin-top:6px;font-size:.75rem;color:#999">点击节点可查看账号详情 · 鼠标滚轮缩放 · 拖拽平移</p>
        </section>
      </div>
    </main>

    <nav style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;border-top:1px solid #e5e5e5;margin-top:16px;color:#666;">
      <a href="https://yuuqq.github.io/journalism-toolbox/" style="text-decoration:none;">📋 工具箱导航</a>
      <span style="opacity:.4">P26</span>
    </nav>
    <script src="./pm-metrics.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="../shared/dark-toggle.js" defer></script>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
    <script src="../shared/cmd-palette.js" defer></script>
    <script src="../shared/toast.js" defer></script>
    <script src="../shared/onboarding.js" defer></script>
    <script src="../shared/pedagogy-data-p1.js" defer></script>
    <script src="../shared/pedagogy-data-p2.js" defer></script>
    <script src="../shared/global-nav.js" defer></script>
    <script src="../shared/kbd-hints.js" defer></script>
  </body>
  </html>
